tools:
  - name: session
    description: Read the editor PID, project, engine and adapter versions, the open level (level_in_project is false for an engine template map) and unsaved maps and assets (dirty is null when Unreal cannot report them). Read-only.
    source_file: scripts/session.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 30
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      properties: {}
      additionalProperties: false

  - name: import_model
    description: Import one Meshy GLB, glTF or FBX from disk into /Game/Meshy/<name> (saved), place its static mesh in the open project level through undo, and read it back. For an FBX, the Meshy texture set next to it (or textures) becomes one PBR material on every slot. Refuses a folder that already holds assets and never replaces any. One-shot; never repeat on an unknown outcome, inspect instead. The level is left unsaved.
    source_file: scripts/import_model.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 300
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [source_path]
      properties:
        source_path: {type: string, minLength: 1, maxLength: 1000, description: Absolute path of the .glb, .gltf or .fbx file.}
        name: {type: string, maxLength: 64, description: Asset and actor name; defaults to the file name.}
        textures:
          type: object
          description: Absolute image paths for a PBR material. Default for an FBX, the Meshy set next to it - <stem>.png, <stem>_normal.png, <stem>_metallic.png, <stem>_roughness.png.
          properties:
            base_color: {type: string}
            normal: {type: string}
            metallic: {type: string}
            roughness: {type: string}
          additionalProperties: false
        place: {type: boolean, default: true, description: Place the mesh in the open level.}
        location:
          type: array
          items: {type: number}
          minItems: 3
          maxItems: 3
          description: Where the base of the model goes, in centimetres; default the world origin.
      additionalProperties: false
    next-tools:
      on-success: [meshy_unreal__inspect_model, meshy_unreal__capture_model]
      on-failure: [meshy_unreal__session]

  - name: inspect_model
    description: Read back a level actor (actor, its label) or a static mesh asset (asset, object path) - vertices, triangles, sections, bounds, Nanite, material slots with parents and parameters, and per texture the role it feeds, its sRGB, compression and green-channel flip, plus the actor transform. With Nanite on, counts are the fallback mesh's once the editor has reloaded it. Read-only.
    source_file: scripts/inspect_model.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 60
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      properties:
        actor: {type: string, maxLength: 128}
        asset: {type: string, pattern: "^/Game/", maxLength: 500}
      additionalProperties: false

  - name: capture_model
    description: Render the open level around an actor (or from the viewport camera without one) into <project>/Saved/MeshyDcc/<file_name>.png, with a temporary scene capture that renders for a few seconds first so streamed geometry and textures are sharp. Works while the editor is in the background and leaves the viewport camera alone. Views are relative to the way an imported Meshy model faces (+Y); three_quarter is front-left.
    source_file: scripts/capture_model.py
    execution: sync
    affinity: any
    enforce_thread_affinity: false
    timeout_hint_secs: 120
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      properties:
        actor: {type: string, maxLength: 128}
        view: {type: string, enum: [front, back, left, right, top, three_quarter], default: front}
        file_name: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        width: {type: integer, minimum: 64, maximum: 3840, default: 1280}
        height: {type: integer, minimum: 64, maximum: 2160, default: 720}
      additionalProperties: false
