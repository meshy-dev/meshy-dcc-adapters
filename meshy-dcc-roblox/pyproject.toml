[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "meshy-dcc-roblox"
version = "0.1.1"
description = "Roblox Studio adapter for Meshy DCC: scene tools and Meshy GLB import"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meshy", email = "support@meshy.ai" }]
keywords = ["roblox", "roblox-studio", "meshy", "dcc", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment",
]
# Pillow decodes the JPEG/PNG textures inside Meshy GLBs; without it the
# import still builds the meshes and reports the textures as skipped.
dependencies = ["meshy-dcc-core>=0.2.0,<0.3.0", "websockets>=14,<18", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-roblox"
Repository = "https://github.com/meshy-dev/meshy-dcc-adapters"
Issues = "https://github.com/meshy-dev/meshy-dcc-adapters/issues"

[project.scripts]
meshy-dcc-roblox = "meshy_dcc_roblox.cli:main"

[project.entry-points."meshy_dcc.adapters"]
roblox = "meshy_dcc_roblox:RobloxDccServer"

[tool.hatch.build.targets.wheel]
packages = ["src/meshy_dcc_roblox"]
artifacts = ["src/meshy_dcc_roblox/skills/**", "src/meshy_dcc_roblox/plugin/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
