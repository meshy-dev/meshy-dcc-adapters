tools:
  - name: new_scene
    description: "Create a new empty Blender scene"
    source_file: scripts/new_scene.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties: {}
    read_only: false
    destructive: true
    idempotent: false
  - name: save_scene
    description: "Save the current Blender scene and read the saved file back. Succeeds only when Blender reports FINISHED and the scene's saved path is a fresh, nonempty file; the result's filepath is the file that was verified. A failed or unconfirmed save is not retried."
    source_file: scripts/save_scene.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        filepath:
          type: "string"
          description: "Optional path to save the scene to. If None, saves to the current file path. If the scene has never been saved, this is required."
    read_only: false
    destructive: false
    idempotent: true
  - name: open_scene
    description: "Open a Blender scene file (.blend) from disk"
    source_file: scripts/open_scene.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        filepath:
          type: "string"
          description: "Absolute path to the .blend file to open."
      required: ["filepath"]
    read_only: false
    destructive: true
    idempotent: false
  - name: list_objects
    description: "List all objects in the current Blender scene"
    source_file: scripts/list_objects.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        object_type:
          type: "string"
          description: "Optional Blender object type filter, e.g. ``\"MESH\"``, ``\"LIGHT\"``, ``\"CAMERA\"``, ``\"ARMATURE\"``."
    read_only: true
    destructive: false
    idempotent: true
  - name: get_scene_info
    description: "Return a hierarchical description of the current scene"
    source_file: scripts/get_scene_info.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
  - name: get_session_info
    description: "Return Blender version, scene path, and basic session statistics"
    source_file: scripts/get_session_info.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
