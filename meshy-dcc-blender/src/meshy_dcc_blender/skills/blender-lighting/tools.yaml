tools:
  - name: create_light
    description: "Create a new light object (POINT, SUN, AREA, SPOT)"
    source_file: scripts/create_light.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        light_type:
          type: "string"
          default: "POINT"
          description: "Type of light: POINT, SUN, AREA, or SPOT."
        name:
          type: "string"
          description: "Optional name for the light object."
        location:
          type: "array"
          items:
            type: "number"
          description: "[x, y, z] position. Defaults to [0, 0, 3]."
        energy:
          type: "number"
          default: 1000.0
          description: "Light energy/intensity in watts."
        color:
          type: "array"
          items:
            type: "number"
          description: "[R, G, B] light color (0-1). Default: white."
    read_only: false
    destructive: false
    idempotent: false
  - name: set_light_properties
    description: "Set energy, color, and other light properties"
    source_file: scripts/set_light_properties.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          description: "Name of the light object."
        energy:
          type: "number"
          description: "Light energy in watts."
        color:
          type: "array"
          items:
            type: "number"
          description: "[R, G, B] color values (0-1)."
        radius:
          type: "number"
          description: "Light radius/size (for POINT and SPOT lights)."
      required: ["name"]
    read_only: false
    destructive: false
    idempotent: true
  - name: list_lights
    description: "List all lights in the current scene"
    source_file: scripts/list_lights.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
  - name: set_world_background
    description: "Set the scene world background color and optional strength; enables the world node tree when one is required"
    source_file: scripts/set_world_background.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        color:
          type: "array"
          items:
            type: "number"
          description: "RGB or RGBA values in the 0-1 range."
        strength:
          type: "number"
          description: "Optional world shader strength when nodes are available."
      required: ["color"]
    read_only: false
    destructive: false
    idempotent: true

  - name: set_light_linking
    description: "Restrict which objects a light illuminates using light linking: a receiver collection and an optional blocker collection."
    source_file: scripts/set_light_linking.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      required: [light_name]
      properties:
        light_name:
          type: string
          minLength: 1
        receiver_collection:
          type: string
          minLength: 1
          description: Collection this light is allowed to illuminate.
        blocker_collection:
          type: string
          minLength: 1
          description: Collection that blocks this light.
        clear:
          type: boolean
          default: false
          description: Remove existing linking instead of setting it.
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
