tools:
  - name: add_modifier
    description: "Add a modifier to a mesh object (Subdivision, Mirror, Array, etc.)"
    source_file: scripts/add_modifier.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        object_name:
          type: "string"
          description: "Name of the mesh object."
        modifier_type:
          type: "string"
          description: "Blender modifier type, e.g. SUBSURF, MIRROR, ARRAY, SOLIDIFY, BEVEL, BOOLEAN, DECIMATE, etc."
        name:
          type: "string"
          description: "Optional name for the modifier. Defaults to Blender's auto-name."
        properties:
          type: "object"
          description: "Optional dict of modifier property overrides, e.g. {\"levels\": 2} for SUBSURF."
      required: ["object_name", "modifier_type"]
    read_only: false
    destructive: false
    idempotent: false
  - name: apply_modifier
    description: "Apply (bake) a modifier permanently to the mesh"
    source_file: scripts/apply_modifier.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        object_name:
          type: "string"
          description: "Name of the mesh object."
        modifier_name:
          type: "string"
          description: "Name of the modifier to apply."
      required: ["object_name", "modifier_name"]
    read_only: false
    destructive: true
    idempotent: false
  - name: list_modifiers
    description: "List all modifiers on an object"
    source_file: scripts/list_modifiers.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        object_name:
          type: "string"
          description: "Name of the object to inspect."
      required: ["object_name"]
    read_only: true
    destructive: false
    idempotent: true
  - name: get_mesh_info
    description: "Get vertex, edge, and face count of a mesh"
    source_file: scripts/get_mesh_info.py
    execution: sync
    affinity: main
    input_schema:
      type: "object"
      additionalProperties: false
      properties:
        object_name:
          type: "string"
          description: "Name of the mesh object."
      required: ["object_name"]
    read_only: true
    destructive: false
    idempotent: true
