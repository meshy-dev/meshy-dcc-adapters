# Blender extension manifest (extensions / bundling).
# https://docs.blender.org/manual/en/latest/advanced/extensions/getting_started.html
# Version is bumped only by release-please (keep in sync with pyproject / wheel).

schema_version = "1.0.0"

id = "dcc_mcp_blender"
version = "0.2.11"
name = "Meshy DCC"
tagline = "Lets AI agents work in Blender through Meshy DCC Core"
maintainer = "Meshy <support@meshy.ai>"
type = "add-on"

tags = ["System", "Pipeline", "Animation"]

# Minimum supported Blender version for the Extensions + wheels workflow.
blender_version_min = "4.5.0"

# The source repository remains MIT. Blender Extensions accepts add-ons under
# GPL-compatible terms, so the assembled marketplace archive is GPL-3.0-or-later
# and retains the bundled MIT notice.
license = ["SPDX:GPL-3.0-or-later"]

location = "Top Bar > Meshy DCC"
description = "Runs the Meshy DCC Core adapter so AI agents can inspect and edit this Blender session."
category = "System"

website = "https://www.meshy.ai"

[permissions]
network = "Host MCP HTTP/SSE and optional gateway election on localhost"
files = "Read bundled skills and SKILL packages from disk"
