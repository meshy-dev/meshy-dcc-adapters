[build-system]
requires=["hatchling>=1.17"]
build-backend="hatchling.build"

[project]
name="meshy-dcc-freecad"
version="0.1.0"
description="Meshy DCC adapter for FreeCAD: typed parametric modeling, document validation and CAD exchange"
readme="README.md"
requires-python=">=3.7"
license={text="MIT"}
authors=[{name="Meshy",email="support@meshy.ai"}]
keywords=["freecad","cad","parametric-modeling","dcc","mcp","automation"]
classifiers=[
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies=["meshy-dcc-core>=0.2.0,<0.3.0"]

[project.urls]
Homepage="https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-freecad"
Repository="https://github.com/meshy-dev/meshy-dcc-adapters"
Issues="https://github.com/meshy-dev/meshy-dcc-adapters/issues"

[project.optional-dependencies]
test=[
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "ruff>=0.8",
  "PyYAML>=6",
  "jsonschema>=4.0",
]
dev=[
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "ruff>=0.8",
  "PyYAML>=6",
  "jsonschema>=4.0",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
meshy-dcc-freecad="meshy_dcc_freecad.cli:main"

[project.entry-points."meshy_dcc.adapters"]
freecad="meshy_dcc_freecad:FreecadMcpServer"

[tool.hatch.build.targets.wheel]
packages=["src/meshy_dcc_freecad"]
artifacts=["src/meshy_dcc_freecad/skills/**"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","."]
markers=[
  "freecad: requires a real FreeCADCmd executable",
  "freecad_gui: requires real FreeCAD GUI view providers in an offscreen native process",
  "freecad_fem: requires a real FreeCAD host with the FEM workbench, ccx and gmsh",
]

[tool.ruff.lint]
select=["E","F","I","B"]

[tool.ruff]
line-length=100
target-version="py37"
