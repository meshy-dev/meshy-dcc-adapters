tools:
  - name: session
    description: Inspect the actual Editor PID, project, dirty scenes, source-write policy, pause/focus state and frame count. Read-only diagnostics.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/session.py
  - name: inspect_object
    description: Read one GameObject by its current instance ID in the active loaded scene in idle Edit Mode. Returns identity, parent, transforms and Editor context without traversing the hierarchy. Rejects assets, components, absent IDs and objects in other scenes. Rediscover IDs after reload or restart.
    input_schema:
      type: object
      required: [instance_id]
      properties:
        instance_id:
          oneOf:
            - {type: string, pattern: "^-?[1-9][0-9]*$", maxLength: 20}
            - {type: integer}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/inspect_object.py
  - name: inspect_renderers
    description: Inspect active-scene material slots, including inactive descendants. Reports the active pipeline, missing materials, shader errors and known Standard/URP Lit pipeline mismatches with bounded findings; not visual validation.
    input_schema:
      type: object
      properties:
        max_findings: {type: integer, minimum: 1, maximum: 100, default: 20}
        max_material_slots: {type: integer, minimum: 0, maximum: 100, default: 0, description: Optional first N material-slot snapshots with Standard and URP Lit texture bindings. Zero omits snapshots.}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/inspect_renderers.py
  - name: inspect_model
    description: Refresh one local FBX or OBJ under Assets and return its imported meshes, materials, animations and dependencies.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/inspect_model.py
  - name: instantiate_model
    description: Instantiate an imported FBX or OBJ under Assets in the active scene, with Undo. An explicitly keyed single FBX texture set may map to one Built-in Standard or URP Lit material according to the active pipeline. Read back the returned scene object before repeating.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
        material_root: {type: string}
        material_textures:
          type: object
          required: [set, base_color]
          properties:
            set: {type: integer, minimum: 0}
            base_color: {$ref: '#/$defs/texture'}
            normal: {$ref: '#/$defs/texture'}
            metallic: {$ref: '#/$defs/texture'}
            roughness: {$ref: '#/$defs/texture'}
          additionalProperties: false
      additionalProperties: false
      $defs:
        texture:
          type: object
          required: [key, path, bytes, sha256]
          properties:
            key: {type: string, minLength: 1}
            path: {type: string, minLength: 1}
            bytes: {type: integer, minimum: 0}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
          additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/instantiate_model.py
  - name: save_scene_as
    description: Save only the active scene to a named .unity path below Assets; refuse to overwrite another scene.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/save_scene_as.py
  - name: open_scene
    description: Open an existing .unity scene below Assets, only when every open scene is saved.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/open_scene.py
