[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "meshy-dcc-godot"
version = "0.1.1"
description = "Godot Engine adapter and 2D game-authoring skills for Meshy DCC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meshy", email = "support@meshy.ai" }]
keywords = ["godot", "mcp", "game-development", "ai", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = ["meshy-dcc-core>=0.2.0,<0.3.0", "websockets>=12"]

[project.urls]
Homepage = "https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-godot"
Repository = "https://github.com/meshy-dev/meshy-dcc-adapters"
Issues = "https://github.com/meshy-dev/meshy-dcc-adapters/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]

[project.scripts]
meshy-dcc-godot = "meshy_dcc_godot.cli:main"
meshy-dcc-godot-install = "meshy_dcc_godot.install:main"

[project.entry-points."meshy_dcc.adapters"]
godot = "meshy_dcc_godot:GodotMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/meshy_dcc_godot"]
artifacts = ["src/meshy_dcc_godot/skills/**", "src/meshy_dcc_godot/godot_addon/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
