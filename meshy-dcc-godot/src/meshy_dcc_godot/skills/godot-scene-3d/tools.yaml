tools:
  - name: add_mesh_instance
    description: Add a primitive MeshInstance3D. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"primitive":{"type":"string","enum":["box","sphere","capsule","cylinder","plane","quad","prism","torus"],"default":"box"},"name":{"type":"string","maxLength":500,"description":"Node name, default Mesh."},"parent_path":{"type":"string","maxLength":500,"description":"Parent node path, default the scene root."},"mesh_properties":{"type":"object","description":"Initial values for the mesh's properties."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
