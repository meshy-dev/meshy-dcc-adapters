tools:
  - name: create_animation_tree
    description: Create and configure an AnimationTree node. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"name":{"type":"string","maxLength":500,"description":"Node name, default AnimationTree."},"parent_path":{"type":"string","maxLength":500,"description":"Parent node path, default the scene root."},"tree_type":{"type":"string","enum":["state_machine","blend_tree"],"default":"state_machine"},"active":{"type":"boolean","default":true}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_animation_tree_structure
    description: Return AnimationTree parameters and tree type. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_tree_parameter
    description: Set an AnimationTree parameter. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"parameter":{"type":"string","maxLength":500,"description":"Parameter path; the parameters/ prefix is optional."},"value":{}},"additionalProperties":false,"required":["parameter","value"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: add_state_machine_state
    description: Add a state-machine animation node. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"state":{"type":"string","maxLength":500,"description":"New state name."},"animation":{"type":"string","maxLength":500,"description":"Animation to play, default the state name."},"position":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":2,"description":"Graph position, default [0, 0]."}},"additionalProperties":false,"required":["state"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: remove_state_machine_state
    description: Remove a state-machine node. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"state":{"type":"string","maxLength":500}},"additionalProperties":false,"required":["state"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: add_state_machine_transition
    description: Add a state-machine transition. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"from":{"type":"string","maxLength":500},"to":{"type":"string","maxLength":500},"xfade_time":{"type":"number","minimum":0,"default":0},"advance_mode":{"type":"integer","minimum":0,"maximum":2,"default":1,"description":"0 disabled, 1 enabled, 2 auto."}},"additionalProperties":false,"required":["from","to"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: remove_state_machine_transition
    description: Remove a state-machine transition. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"from":{"type":"string","maxLength":500},"to":{"type":"string","maxLength":500}},"additionalProperties":false,"required":["from","to"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_blend_tree_node
    description: Add or replace an AnimationNode in a blend tree. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"An AnimationTree; empty or '.' is the scene root."},"name":{"type":"string","maxLength":500,"default":"Node","description":"Blend-tree node name; an existing one is replaced."},"type":{"type":"string","maxLength":500,"default":"AnimationNodeAnimation","description":"AnimationNode class."},"position":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":2,"description":"Graph position, default [0, 0]."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
