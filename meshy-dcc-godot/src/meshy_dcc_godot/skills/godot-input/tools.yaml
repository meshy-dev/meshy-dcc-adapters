tools:
  - name: simulate_key
    description: Send a keyboard event to the running game. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"keycode":{"type":"integer","default":0,"description":"Godot Key code, such as 65 for A."},"physical_keycode":{"type":"integer","default":0},"pressed":{"type":"boolean","default":true},"echo":{"type":"boolean","default":false}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: simulate_mouse_click
    description: Send a mouse button event to the running game. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"position":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":2,"description":"Viewport [x, y], default [0, 0]."},"button":{"type":"integer","default":1,"description":"MouseButton: 1 left, 2 right, 3 middle."},"pressed":{"type":"boolean","default":true}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: simulate_mouse_move
    description: Send mouse motion to the running game. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"position":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":2,"description":"Viewport [x, y], default [0, 0]."},"relative":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":2,"description":"Motion [dx, dy], default [0, 0]."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: simulate_action
    description: Press or release a Godot input action in the running game. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"action":{"type":"string","maxLength":500,"description":"An existing InputMap action."},"pressed":{"type":"boolean","default":true},"strength":{"type":"number","default":1.0,"description":"Press strength."}},"additionalProperties":false,"required":["action"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: simulate_sequence
    description: Queue a sequence of runtime input events. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"events":{"type":"array","items":{"type":"object"},"maxItems":100,"description":"Each event is {type: key, mouse_click, mouse_move or action (default), plus that simulate tool's parameters}."}},"additionalProperties":false,"required":["events"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_input_actions
    description: List InputMap actions and deadzones. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_input_action
    description: Create or replace an InputMap action. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"action":{"type":"string","maxLength":500,"description":"Action name; created when missing."},"deadzone":{"type":"number","minimum":0,"maximum":1,"description":"Default 0.5 for a new action, otherwise unchanged."},"replace_events":{"type":"boolean","default":false,"description":"Remove the action's existing events first."},"keycode":{"type":"integer","description":"Add a key event with this Godot Key code."}},"additionalProperties":false,"required":["action"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
