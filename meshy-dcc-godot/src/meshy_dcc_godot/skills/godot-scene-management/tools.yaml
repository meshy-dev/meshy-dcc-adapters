tools:
  - name: get_scene_tree
    description: Return the edited scene hierarchy. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_scene_file_content
    description: Read a bounded .tscn file as text. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tscn file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_scene
    description: Create and optionally open a new scene. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"New .tscn file."},"root_type":{"type":"string","maxLength":500,"default":"Node2D","description":"Godot Node class of the root."},"root_name":{"type":"string","maxLength":500,"default":"Root"},"open":{"type":"boolean","default":true,"description":"Open the scene in the editor."},"overwrite":{"type":"boolean","default":false,"description":"Replace an existing file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: open_scene
    description: Open a scene in the editor. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tscn file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: delete_scene
    description: Delete a project scene file. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tscn file that is not the edited scene."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: add_scene_instance
    description: Instance a PackedScene below an edited-scene node. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"scene_path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tscn, .scn, .glb or .gltf file."},"name":{"type":"string","maxLength":500,"description":"Node name, default the scene root's name."},"parent_path":{"type":"string","maxLength":500,"description":"Parent node path, default the scene root."}},"additionalProperties":false,"required":["scene_path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: play_scene
    description: Run the main, current, or specified scene. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"mode":{"type":"string","enum":["main","current","custom"],"default":"current"},"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"The .tscn or .scn to run when mode is custom."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: stop_scene
    description: Stop the running project. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: save_scene
    description: Save the edited scene, optionally to a new path. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"Save as this .tscn; default the scene's own file."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
