tools:
  - name: get_project_info
    description: Return project metadata, version, viewport, and autoloads. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_filesystem_tree
    description: Return a filtered recursive project file tree. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"extensions":{"type":"array","items":{"type":"string","maxLength":500},"description":"Extensions to include, without the dot; default all."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: search_files
    description: Search project files by glob or name fragment. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"query":{"type":"string","maxLength":500,"description":"Case-insensitive part of the res:// path; empty matches all."},"extension":{"type":"string","maxLength":500,"description":"Only files with this extension, without the dot."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_project_settings
    description: Read project settings by prefix or key. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"prefix":{"type":"string","maxLength":500,"description":"Setting name or prefix; empty returns all, up to 500."},"key":{"type":"string","maxLength":500,"description":"Same as prefix, read when prefix is absent."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_project_setting
    description: Set and persist one project setting. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"key":{"type":"string","maxLength":500,"description":"Setting name; autoload/ keys are refused."},"value":{}},"additionalProperties":false,"required":["key","value"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: uid_to_project_path
    description: Convert a Godot resource UID to res:// path. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"uid":{"type":"string","maxLength":500,"description":"uid://... text, or the numeric id as a string."}},"additionalProperties":false,"required":["uid"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: project_path_to_uid
    description: Convert a res:// resource path to a Godot UID. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
