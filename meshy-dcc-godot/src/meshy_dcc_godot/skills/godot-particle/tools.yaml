tools:
  - name: create_particles
    description: Add GPUParticles2D or GPUParticles3D. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"is_3d":{"type":"boolean","default":false},"name":{"type":"string","maxLength":500,"description":"Node name, default Particles."},"parent_path":{"type":"string","maxLength":500,"description":"Parent node path, default the scene root."},"properties":{"type":"object","description":"Initial values for existing properties."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_particle_material
    description: Configure a ParticleProcessMaterial. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"A GPUParticles2D or GPUParticles3D; empty or '.' is the scene root."},"properties":{"type":"object","description":"ParticleProcessMaterial property values."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_particle_color_gradient
    description: Set particle color gradient points. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"A GPUParticles2D or GPUParticles3D; empty or '.' is the scene root."},"colors":{"type":"array","items":{"type":"string","maxLength":500},"minItems":2,"default":["#ffffffff","#ffffff00"],"description":"Color strings such as #ff8800ff, one per offset."},"offsets":{"type":"array","items":{"type":"number"},"minItems":2,"default":[0.0,1.0],"description":"Gradient positions from 0 to 1."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: apply_particle_preset
    description: Apply a deterministic particle preset. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"A GPUParticles2D or GPUParticles3D; empty or '.' is the scene root."},"preset":{"type":"string","enum":["fire","smoke","sparks"],"default":"fire"}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_particle_info
    description: Return particle system properties. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"Edited-scene node path; empty or '.' is the scene root."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
