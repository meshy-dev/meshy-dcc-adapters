tools:
  - name: read_resource
    description: Load and serialize a resource property summary. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tres or .res file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: edit_resource
    description: Set properties and save a project resource. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tres or .res file."},"properties":{"type":"object","description":"New values for existing properties."}},"additionalProperties":false,"required":["path","properties"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_resource
    description: Instantiate and save a typed Resource. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"New .tres or .res file; an existing file is replaced."},"type":{"type":"string","maxLength":500,"default":"Resource","description":"Godot Resource class."},"properties":{"type":"object","description":"Initial values; unknown properties are ignored."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_resource_preview
    description: Generate or return a cached resource preview. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing resource file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: add_autoload
    description: Register a project autoload singleton. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"name":{"type":"string","maxLength":500,"description":"Autoload name, without '/'."},"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .gd or .tscn file."}},"additionalProperties":false,"required":["name","path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: remove_autoload
    description: Remove a project autoload singleton. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"name":{"type":"string","maxLength":500}},"additionalProperties":false,"required":["name"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
