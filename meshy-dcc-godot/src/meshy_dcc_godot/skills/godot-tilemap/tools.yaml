tools:
  - name: tilemap_set_cell
    description: Set one TileMapLayer cell. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"A TileMapLayer; empty or '.' is the scene root."},"cell":{"type":"array","items":{"type":"integer"},"minItems":2,"maxItems":2,"default":[0,0]},"source_id":{"type":"integer","minimum":-1,"description":"TileSet source id; -1 erases the cell."},"atlas_coords":{"type":"array","items":{"type":"integer"},"minItems":2,"maxItems":2,"description":"Tile [x, y] in the atlas source."},"alternative":{"type":"integer","minimum":0,"default":0}},"additionalProperties":false,"required":["source_id","atlas_coords"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
