tools:
  - name: get_editor_errors
    description: Return errors captured by the Meshy DCC editor plugin. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_editor_screenshot
    description: Capture the selected editor viewport to a PNG. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"default":"res://.meshy-dcc/editor.png","description":"Output .png file."},"mode":{"type":"string","enum":["2d","3d"],"default":"3d"},"viewport":{"type":"integer","minimum":0,"maximum":3,"default":0,"description":"3D editor viewport index."},"budget_ms":{"type":"integer","minimum":1,"maximum":50},"include_base64":{"type":"boolean","default":false,"description":"Also return the PNG as base64."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_game_screenshot
    description: Capture game pixels on the runtime thread and encode the PNG in the adapter. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"default":"res://.meshy-dcc/game.png","description":"Output .png file."},"include_base64":{"type":"boolean","default":false,"description":"Also return the PNG as base64."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: execute_editor_script
    description: Run one @tool method with an observational budget and optional caller-driven chunks. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing @tool .gd file."},"method":{"type":"string","maxLength":500,"default":"run","description":"Method to call with arguments as its one argument."},"arguments":{"default":{},"description":"Value passed to the method."},"budget_ms":{"type":"integer","minimum":1,"maximum":50,"default":50,"description":"Compared with the elapsed time; the call is not preempted."},"chunked":{"type":"boolean","default":false,"description":"The method returns {done, next_cursor}; the reply carries the next call."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: clear_output
    description: Clear errors captured by the Meshy DCC editor plugin. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_signals
    description: Return node signals and their connections. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"Edited-scene node path; empty or '.' is the scene root."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: reload_plugin
    description: Reload the Meshy DCC editor plugin. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: reload_project
    description: Rescan project files and reload changed scripts. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_output_log
    description: Return recent Meshy DCC editor and runtime messages. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
