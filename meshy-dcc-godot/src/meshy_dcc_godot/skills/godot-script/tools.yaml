tools:
  - name: list_scripts
    description: List project GDScript files and global class metadata. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: read_script
    description: Read a bounded project GDScript file. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .gd file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_script
    description: Create a GDScript file from source or a safe template. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"New .gd file."},"source":{"type":"string","maxLength":1000000,"description":"Script text, default 'extends <base_type>'."},"base_type":{"type":"string","maxLength":500,"default":"Node","description":"Class to extend when source is not given."},"overwrite":{"type":"boolean","default":false,"description":"Replace an existing file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: edit_script
    description: Replace source or perform an exact search/replace edit. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .gd file."},"source":{"type":"string","maxLength":1000000,"description":"Full replacement text."},"search":{"type":"string","maxLength":100000,"description":"Exact text to replace when source is not given."},"replace":{"type":"string","maxLength":100000,"default":""},"replace_all":{"type":"boolean","default":false,"description":"Replace every match; otherwise search must be unique."},"allow_empty":{"type":"boolean","default":false,"description":"Allow the result to be empty."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: attach_script
    description: Attach a project script to a scene node. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500,"description":"Edited-scene node path; empty or '.' is the scene root."},"script_path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .gd file."}},"additionalProperties":false,"required":["script_path"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_open_scripts
    description: List scripts currently open in the script editor. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: validate_script
    description: Compile-check GDScript source or a project script. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"source":{"type":"string","maxLength":1000000,"description":"GDScript to compile; when empty, path is read instead."},"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .gd file, checked when source is not given."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: search_in_files
    description: Search bounded text files under res://. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"query":{"type":"string","maxLength":500,"description":"Case-insensitive text to find."},"extensions":{"type":"array","items":{"type":"string","maxLength":500},"description":"Extensions to search, without the dot; default gd, tscn, tres, gdshader, cfg, json."}},"additionalProperties":false,"required":["query"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
