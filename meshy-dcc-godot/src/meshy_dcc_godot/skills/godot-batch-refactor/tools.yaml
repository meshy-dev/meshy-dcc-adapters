tools:
  - name: find_nodes_by_type
    description: Find edited-scene nodes by class. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"type":{"type":"string","maxLength":500,"default":"Node","description":"Godot class; subclasses match, so Node matches every node."}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: find_signal_connections
    description: Return scene signal connections. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: batch_set_property
    description: Set a property on matching edited-scene nodes. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"type":{"type":"string","maxLength":500,"default":"Node","description":"Godot class; subclasses match, so Node matches every node."},"property":{"type":"string","maxLength":500},"value":{}},"additionalProperties":false,"required":["property","value"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: find_node_references
    description: Search project text for a node path or name. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"query":{"type":"string","maxLength":500,"description":"Case-insensitive text to find."},"extensions":{"type":"array","items":{"type":"string","maxLength":500},"description":"Extensions to search, without the dot; default gd, tscn, tres, gdshader, cfg, json."}},"additionalProperties":false,"required":["query"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_scene_dependencies
    description: Return dependencies for a scene resource. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500,"description":"An existing .tscn or .scn file."}},"additionalProperties":false,"required":["path"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: cross_scene_set_property
    description: Update matching nodes across project scenes. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"type":{"type":"string","maxLength":500,"default":"Node","description":"Godot class; subclasses match, so Node matches every node."},"property":{"type":"string","maxLength":500},"value":{}},"additionalProperties":false,"required":["property","value"]}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: find_script_references
    description: Find project references to a script or resource. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"query":{"type":"string","maxLength":500,"description":"Case-insensitive text to find."},"extensions":{"type":"array","items":{"type":"string","maxLength":500},"description":"Extensions to search, without the dot; default gd, tscn, tres, gdshader, cfg, json."}},"additionalProperties":false,"required":["query"]}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: detect_circular_dependencies
    description: Detect circular PackedScene dependencies. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
