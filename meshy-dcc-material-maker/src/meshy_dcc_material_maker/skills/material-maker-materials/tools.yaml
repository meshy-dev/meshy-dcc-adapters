tools:
  - name: get_status
    description: Report the project folder, the Material Maker executable and version, its example materials, node type count and export targets. With probe_project, also export that .ptex to a temporary folder to prove Material Maker works. Read-only.
    source_file: scripts/get_status.py
    input_schema:
      type: object
      properties:
        probe: {type: boolean, default: true, description: "Run the readiness export when probe_project is given."}
        probe_project: {type: string, minLength: 1, description: "A .ptex in the project to export as a readiness check."}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 60}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

  - name: create_material
    description: Create a new .ptex material graph in the project, from template "blank" (only the Material output node), from a Material Maker example named by template (get_status lists them, e.g. bricks, rusted_metal, wood), or as a copy of source. Never replaces a file. Returns the graph.
    source_file: scripts/create_material.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 1024, pattern: "\\.ptex$", description: "New .ptex path, relative to the project folder."}
        template: {type: string, minLength: 1, maxLength: 64, default: blank, description: "blank, or a Material Maker example name."}
        source: {type: string, minLength: 1, maxLength: 1024, description: "An existing .ptex in the project to copy instead."}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}
    call_examples:
      - arguments: {path: "materials/rust.ptex", template: "rusted_metal"}
        note: Start from Material Maker's rusted metal example.

  - name: get_graph
    description: Read a .ptex graph back - each top-level node's name, type and parameters, the connections, and the file's sha256 for edit_graph. With node, only that node and its connections. Read-only.
    source_file: scripts/get_graph.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 1024, description: ".ptex path, relative to the project folder."}
        node: {type: string, minLength: 1, maxLength: 64}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

  - name: edit_graph
    description: >-
      Apply operations to a .ptex graph and save it, all or nothing. Ops -
      {op: add_node, name, type, parameters?, position?}; {op: remove_node, node};
      {op: set_parameters, node, parameters}; {op: connect, from, from_port, to, to_port}
      (replaces what fed that input); {op: disconnect, to, to_port}. The Material node's
      inputs are 0 albedo, 1 metallic, 2 roughness, 3 emission, 4 normal, 5 ambient occlusion,
      6 depth/height, 7 opacity, 8 subsurface. Colors are {r, g, b, a} from 0 to 1. Pass
      expected_sha256 from get_graph to refuse an edit over a newer file.
    source_file: scripts/edit_graph.py
    input_schema:
      type: object
      required: [path, operations]
      properties:
        path: {type: string, minLength: 1, maxLength: 1024}
        operations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [op]
            properties:
              op: {type: string, enum: [add_node, remove_node, set_parameters, connect, disconnect]}
              name: {type: string, description: "add_node: the new node's name."}
              type: {type: string, description: "add_node: a node type from list_node_types."}
              node: {type: string, description: "remove_node, set_parameters: the node's name."}
              parameters: {type: object}
              position: {type: object, properties: {x: {type: number}, y: {type: number}}}
              from: {type: string}
              from_port: {type: integer, minimum: 0}
              to: {type: string}
              to_port: {type: integer, minimum: 0}
        expected_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false}
    call_examples:
      - arguments:
          path: "materials/stone.ptex"
          operations:
            - {op: add_node, name: Noise, type: perlin, parameters: {scale_x: 8, scale_y: 8}}
            - {op: connect, from: Noise, from_port: 0, to: Material, to_port: 2}
        note: Drive roughness with a noise.

  - name: list_node_types
    description: Search Material Maker's node types by name or description with query, or pass node_type for its inputs, outputs and parameters (names, types, defaults, ranges, enum values). Read-only.
    source_file: scripts/list_node_types.py
    input_schema:
      type: object
      properties:
        query: {type: string, maxLength: 64}
        node_type: {type: string, minLength: 1, maxLength: 64}
        limit: {type: integer, minimum: 1, maximum: 500, default: 50}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

  - name: inspect_project
    description: Read bounded PTEX JSON and summarize graph, node-type, connection, material-node, size, and hash metadata.
    source_file: scripts/inspect_project.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, description: "PTEX project, relative to the project folder."}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
    call_examples:
      - arguments: {path: "materials/bricks.ptex"}
        note: Inspect a procedural material before export.
    next-tools:
      on-failure: [get_status]

  - name: validate_project
    description: Validate bounded PTEX graph structure, unique node names, connection endpoints, ports, configured limits, and nodes this adapter refuses to run (webcam, website downloads, export nodes writing elsewhere).
    source_file: scripts/validate_project.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
    next-tools:
      on-failure: [inspect_project]

  - name: export_material
    description: Render a .ptex through Material Maker into a new folder of textures (2048x2048) and an engine material, then read back each file's size, sha256 and PNG dimensions. target is a Material Maker export profile (get_status lists them) or Blender, GLTF, Godot, Unity, Unreal. Material Maker briefly opens and takes focus while it renders.
    source_file: scripts/export_material.py
    input_schema:
      type: object
      required: [project_path, output_directory]
      properties:
        project_path: {type: string, minLength: 1}
        output_directory: {type: string, minLength: 1, description: "A new folder, relative to the project folder."}
        target: {type: string, minLength: 1, maxLength: 64, default: "Godot/Godot 4 Standard"}
        output_file: {type: string, minLength: 1, maxLength: 128, default: "%f"}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 900}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}
    call_examples:
      - arguments: {project_path: "materials/bricks.ptex", output_directory: "exports/bricks-godot", target: "Godot/Godot 4 Standard"}
        note: Export a material into a new Godot handoff folder.
    next-tools:
      on-failure: [validate_project, get_status]

  - name: open_in_material_maker
    description: Open a .ptex from the project in Material Maker's own window so the user can look at it, typically after export_material. Starts a separate Material Maker process and returns at once with its pid; it does not touch a Material Maker the user already has open and keeps running after the instance stops. Material Maker does not reload a file changed on disk, so before editing this graph again ask the user to close that window, and open it again afterwards. Never edit a graph the user is editing.
    source_file: scripts/open_in_material_maker.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 1024, pattern: "\\.ptex$", description: ".ptex path, relative to the project folder."}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: false, open_world_hint: false}
    call_examples:
      - arguments: {path: "materials/stone.ptex"}
        note: Show the user the material just exported.
