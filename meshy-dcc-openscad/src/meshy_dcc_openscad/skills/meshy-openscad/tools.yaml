tools:
  - name: write_print_base
    description: Write a new parametric .scad that imports a Meshy STL from the workspace, scales it to target_height mm (0 keeps its size), centres it and stands it on a round or square base; read the bytes back. Never replaces a file.
    source_file: scripts/write_print_base.py
    input_schema:
      type: object
      required: [output_path, mesh_path]
      properties:
        output_path: {type: string, minLength: 1, maxLength: 4096, description: Absolute path of the new .scad inside the workspace roots.}
        mesh_path: {type: string, minLength: 1, maxLength: 4096, description: Absolute path of the .stl inside the workspace roots.}
        target_height: {type: number, minimum: 0, maximum: 10000, default: 0, description: Model height in mm after scaling; 0 keeps the mesh units.}
        up_axis: {type: string, enum: [z, y], default: z, description: y stands a Y-up mesh upright.}
        base_shape: {type: string, enum: [round, square, none], default: round}
        base_height: {type: number, minimum: 0, maximum: 1000, default: 3}
        base_margin: {type: number, minimum: 0, maximum: 1000, default: 4}
        sink: {type: number, minimum: 0, maximum: 1000, default: 0.5, description: How far the model sinks into the base, at most base_height.}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
    call_examples:
      - arguments: {output_path: "/path/to/project/cat_on_base.scad", mesh_path: "/path/to/project/meshy/cat.stl", target_height: 60, up_axis: "y"}
        note: A 60 mm tall figure from a Y-up Meshy mesh on a round base.
    next-tools:
      on-success: [openscad_pipeline__export_model, openscad_pipeline__render_preview]
