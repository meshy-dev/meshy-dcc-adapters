[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshy-dcc-maya"
version = "0.1.0"
description = "Meshy DCC Core adapter for Autodesk Maya: a Maya module that serves scene, import, material and render tools to the meshy-dcc CLI"
authors = [{ name = "Meshy", email = "support@meshy.ai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["maya", "mcp", "dcc", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "meshy-dcc-core>=0.2.0,<0.3.0",
    "packaging>=21.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0",
    "requests>=2.28.0",
    "ruff>=0.8.0",
    "hatchling",
    "build",
    "tomli; python_version < '3.11'",
    "pyyaml>=5.0",
    "jsonschema>=4.17,<5",
]

[project.urls]
Homepage = "https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-maya"
Repository = "https://github.com/meshy-dev/meshy-dcc-adapters"
Issues = "https://github.com/meshy-dev/meshy-dcc-adapters/issues"

[project.entry-points."meshy_dcc.adapters"]
maya = "meshy_dcc_maya:MayaMcpServer"

[project.scripts]
meshy-dcc-maya = "meshy_dcc_maya.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meshy_dcc_maya"]

[tool.hatch.build.targets.wheel.force-include]
"maya/plugin/meshy_dcc_maya_plugin.py" = "meshy_dcc_maya/install_assets/maya/plugin/meshy_dcc_maya_plugin.py"
"maya/userSetup.py" = "meshy_dcc_maya/install_assets/maya/userSetup.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not e2e and not packaging and not integration'"
markers = [
    "e2e: end-to-end tests that require a real Maya standalone interpreter (tahv/mayapy)",
    "packaging: tests for packaging/assemble_mod.py that require network access to PyPI",
    "integration: integration tests that require a running Maya instance (local mayapy or Docker)",
]

[tool.coverage.run]
source = ["meshy_dcc_maya"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["meshy_dcc_maya"]
