[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshy-dcc-zbrush"
version = "0.1.1"
description = "Meshy DCC adapter for ZBrush 2026.1+: an in-ZBrush socket bridge plus an external Python sidecar"
authors = [{ name = "Meshy", email = "support@meshy.ai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["zbrush", "maxon", "mcp", "dcc", "ai", "llm", "model-context-protocol", "3d-sculpting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "meshy-dcc-core>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.8.0",
    "hatchling",
    "build>=1.0",
    "twine>=5.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-zbrush"
Repository = "https://github.com/meshy-dev/meshy-dcc-adapters/tree/main/meshy-dcc-zbrush"
Installation = "https://github.com/meshy-dev/meshy-dcc-adapters/blob/main/meshy-dcc-zbrush/install.md"

[project.scripts]
meshy-dcc-zbrush = "meshy_dcc_zbrush.cli:main"

[project.entry-points."meshy_dcc.adapters"]
zbrush = "meshy_dcc_zbrush:ZBrushMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/meshy_dcc_zbrush"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/plugin/mcp_socket_bridge.py" = "meshy_dcc_zbrush/plugin/mcp_socket_bridge.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
